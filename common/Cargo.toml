[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Databáze (Postgres + Timescale)
# 'runtime-tokio-rustls' je bezpečný default, 'chrono' pro práci s časem
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Serializace
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging a Tracing (klíčové pro stdout logy)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0" # Pro zjednodušení v binárkách

# Práce s časem
chrono = { version = "0.4", features = ["serde"] }

# Konfigurace (načítání ENV)
config = "0.13"
dotenv = "0.15"