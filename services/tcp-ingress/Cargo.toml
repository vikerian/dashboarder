[package]
name = "tcp-ingress"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../../common" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Klient pro odeslání dat do interního Mosquitto
rumqttc = "0.24" 
dotenv = "0.15"